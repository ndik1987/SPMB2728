  <!DOCTYPE html>
  <html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SPMB</title>
    <link rel="icon" href="https://pngup.com/K1Vd/ndik%20ya.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #eee;
        overflow: hidden; /* Mencegah scroll ganda */
      }

      .iframe-container {
        width: 100%;
        height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
        overflow: hidden;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="iframe-container">
      <iframe
        id="app"
        src="https://script.google.com/macros/s/AKfycbwb29DegP1KFkkRLxE_g0oWemVisQ4me4ZK3qsbDYTd5ZqKbQgSR9qqvTQAep63hT0Lqw/exec"
        scrolling="yes"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        allow="fullscreen; camera; microphone; display-capture; geolocation;">
      </iframe>
    </div>
  </body>
  </html>
